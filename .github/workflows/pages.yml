name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check index.html structure
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import sys

          VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input",
                  "link", "meta", "source", "track", "wbr"}

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack, self.errors = [], []
              def handle_starttag(self, tag, attrs):
                  if tag not in VOID:
                      self.stack.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack or self.stack[-1][0] != tag:
                      self.errors.append(f"line {self.getpos()[0]}: unexpected </{tag}>")
                      return
                  self.stack.pop()

          src = open("index.html", encoding="utf-8").read()
          if "<!DOCTYPE html>" not in src[:200] and "<!doctype html>" not in src[:200]:
              sys.exit("index.html: missing <!DOCTYPE html>")
          c = Checker()
          c.feed(src)
          c.close()
          c.errors += [f"line {pos[0]}: <{tag}> never closed" for tag, pos in c.stack]
          if c.errors:
              print("\n".join(c.errors))
              sys.exit(1)
          print("index.html: OK")
          PY

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site (index.html only)
        run: |
          mkdir _site
          cp index.html _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
